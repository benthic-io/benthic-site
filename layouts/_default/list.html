{{ define "main" }}
<section class="content">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ .Content }} {{ if .Pages }}
    <ul class="page-list">
      {{ range .Pages.ByTitle }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
    {{ end }}
  </div>
</section>
{{ end }}
