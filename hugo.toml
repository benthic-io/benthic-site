baseURL = "/"
languageCode = "en-us"
title = "benthic.io | little data for big change"

# No page uses tags or categories, but Hugo still generated /tags/ and
# /categories/ and listed them in sitemap.xml — two empty pages advertised as
# content. Disable the kinds rather than publishing empty indexes.
disableKinds = ["taxonomy", "term"]


[params]
  email = "brian@benthic.io"
  x_handle = "@otherdrums"
  x_link = "https://x.com/otherdrums"
  facebook = "Brian Mulkern"
  facebook_link = "https://www.facebook.com/brian.mulkern.5"
  description = "benthic.io is a free open data platform: geocoded U.S. government datasets served over PostgREST with cryptographically verifiable BDP provenance manifests."
[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "dracula"
  lineNos = false
  noClasses = false
  guessSyntax = true

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "APIs"
    url = "/docs/"
    weight = 20
  [[menu.main]]
    name = "BDP"
    url = "/bdp/"
    weight = 30
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 40